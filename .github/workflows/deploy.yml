name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy application to EC2
        run: |
          scp -i ~/.ssh/ec2_key -r app \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/"

      - name: Build and deploy Docker container
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

          docker rm -f production-app 2>/dev/null || true

          docker build \
            -t production-infrastructure:latest \
            /home/ubuntu/app

          docker run -d \
            -p 80:80 \
            --name production-app \
            production-infrastructure:latest

          docker ps

          EOF